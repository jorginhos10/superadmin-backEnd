# Reverse proxy for the ChefControl SuperAdmin FastAPI backend.
# Runs on the same EC2 instance as chefcontrol-backend but as its own
# nginx server block / systemd service, on a different port (8001) and
# a different subdomain, so it stays fully isolated from the tenant-facing
# backend (chefcontrol-backend, port 8000).
#
# Copy to /etc/nginx/sites-available/chefcontrol-superadmin-backend, symlink
# into sites-enabled, then run certbot --nginx to fill in the SSL block.
#
# Replace SUPERADMIN_API_DOMAIN before use (e.g. admin-api.cloud-control.co).

server {
    listen 80;
    listen [::]:80;
    server_name SUPERADMIN_API_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
